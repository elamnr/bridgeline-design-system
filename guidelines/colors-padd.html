<!-- @dsCard group="Colors" viewport="700x220" name="PADD palette" subtitle="Cool blues + sunset red — powers data-bl-theme=&quot;padd&quot;" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{background:#000;color:var(--bl-tan);font-family:var(--bl-font-display);text-transform:uppercase;letter-spacing:.02em;padding:20px}.row{display:flex;gap:6px}.sw{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}.chip{height:56px}.sw:first-child .chip{border-radius:28px 0 0 28px}.sw:last-child .chip{border-radius:0 28px 28px 0}b{font-weight:500;font-size:13px;color:#F3F3FC}i{font-style:normal;font-size:10px;color:#9EA5BA;text-transform:none}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--bl-padd-alpha-blue)"></div><b>alpha blue</b><i>--bl-padd-alpha-blue</i></div><div class="sw"><div class="chip" style="background:var(--bl-padd-beta-blue)"></div><b>beta blue</b><i>--bl-padd-beta-blue</i></div><div class="sw"><div class="chip" style="background:var(--bl-padd-arctic-ice)"></div><b>arctic ice</b><i>--bl-padd-arctic-ice</i></div><div class="sw"><div class="chip" style="background:var(--bl-padd-arctic-snow)"></div><b>arctic snow</b><i>--bl-padd-arctic-snow</i></div><div class="sw"><div class="chip" style="background:var(--bl-padd-radioactive)"></div><b>radioactive</b><i>--bl-padd-radioactive</i></div></div><div style="height:14px"></div><div class="row"><div class="sw"><div class="chip" style="background:var(--bl-padd-night-cloud)"></div><b>night cloud</b><i>--bl-padd-night-cloud</i></div><div class="sw"><div class="chip" style="background:var(--bl-padd-night-rain)"></div><b>night rain</b><i>--bl-padd-night-rain</i></div><div class="sw"><div class="chip" style="background:var(--bl-padd-starship-white)"></div><b>starship white</b><i>--bl-padd-starship-white</i></div><div class="sw"><div class="chip" style="background:var(--bl-padd-sunset-red)"></div><b>sunset red</b><i>--bl-padd-sunset-red</i></div></div></body></html>
