<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{background:#000;color:var(--bl-tan);font-family:var(--bl-font-display);text-transform:uppercase;letter-spacing:.02em;padding:20px}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}.chip{height:64px}.sw:first-child .chip{border-radius:32px 0 0 32px}.sw:last-child .chip{border-radius:0 32px 32px 0}b{font-weight:500;font-size:15px;color:var(--bl-bone)}i{font-style:normal;font-size:11px;color:var(--bl-peach);text-transform:none}.chip{outline:1px solid #333}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--bl-space)"></div><b>Space</b><i>--bl-space · #000000</i></div><div class="sw"><div class="chip" style="background:var(--bl-hull)"></div><b>Hull</b><i>--bl-hull · #0F1C26</i></div><div class="sw"><div class="chip" style="background:var(--bl-bone)"></div><b>Bone</b><i>--bl-bone · #F3F4F7</i></div></div></body></html>
