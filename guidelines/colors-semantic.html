<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{background:#000;color:var(--bl-tan);font-family:var(--bl-font-display);text-transform:uppercase;letter-spacing:.02em;padding:20px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.t{display:flex;gap:8px;align-items:center;font-size:12px;text-transform:none;color:var(--bl-bone)}.t div{width:28px;height:28px;flex-shrink:0;outline:1px solid #333}</style></head><body><div class="g"><div class="t"><div style="background:var(--bl-surface)"></div>surface</div><div class="t"><div style="background:var(--bl-surface-raised)"></div>surface-raised</div><div class="t"><div style="background:var(--bl-frame-primary)"></div>frame-primary</div><div class="t"><div style="background:var(--bl-frame-secondary)"></div>frame-secondary</div><div class="t"><div style="background:var(--bl-frame-accent)"></div>frame-accent</div><div class="t"><div style="background:var(--bl-text)"></div>text</div><div class="t"><div style="background:var(--bl-text-strong)"></div>text-strong</div><div class="t"><div style="background:var(--bl-text-muted)"></div>text-muted</div><div class="t"><div style="background:var(--bl-alert)"></div>alert</div><div class="t"><div style="background:var(--bl-caution)"></div>caution</div><div class="t"><div style="background:var(--bl-nominal)"></div>nominal</div><div class="t"><div style="background:var(--bl-mono-ink)"></div>mono-ink</div></div></body></html>
