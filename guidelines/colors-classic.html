<!-- @dsCard group="Colors" viewport="700x140" name="Classic palette" subtitle="Original warm console — data-bl-theme=&quot;classic&quot;" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{background:#000;color:var(--bl-tan);font-family:var(--bl-font-display);text-transform:uppercase;letter-spacing:.02em;padding:20px}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}.chip{height:64px}.sw:first-child .chip{border-radius:32px 0 0 32px}.sw:last-child .chip{border-radius:0 32px 32px 0}b{font-weight:500;font-size:15px;color:var(--bl-bone)}i{font-style:normal;font-size:11px;color:var(--bl-lilac);text-transform:none}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--bl-classic-amber)"></div><b>Amber</b><i>--bl-classic-amber · #FF9900</i></div><div class="sw"><div class="chip" style="background:var(--bl-classic-tan)"></div><b>Tan</b><i>--bl-classic-tan · #FFCC99</i></div><div class="sw"><div class="chip" style="background:var(--bl-classic-peach)"></div><b>Peach</b><i>--bl-classic-peach · #FF9966</i></div><div class="sw"><div class="chip" style="background:var(--bl-classic-lilac)"></div><b>Lilac</b><i>--bl-classic-lilac · #CC99CC</i></div><div class="sw"><div class="chip" style="background:var(--bl-classic-sky)"></div><b>Sky</b><i>--bl-classic-sky · #99CCFF</i></div></div></body></html>
