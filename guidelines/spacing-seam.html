<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{background:#000;color:var(--bl-tan);font-family:var(--bl-font-display);text-transform:uppercase;letter-spacing:.02em;padding:20px}.r{display:flex;gap:var(--bl-seam)}.r div{height:48px}.n{display:flex;gap:18px;font-size:12px;color:var(--bl-lilac);margin-top:10px;text-transform:none}</style></head><body><div class="r"><div style="flex:2;background:var(--bl-amber);border-radius:24px 0 0 24px"></div><div style="flex:1;background:var(--bl-tan)"></div><div style="flex:.6;background:var(--bl-peach)"></div><div style="flex:1.4;background:var(--bl-lilac);border-radius:0 24px 24px 0"></div></div><div class="n"><span>--bl-seam 4px (screen)</span><span>--print-min-seam-screen 1.2mm</span><span>--print-min-seam-engrave 0.6mm</span></div></body></html>
