<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{background:#000;color:var(--bl-tan);font-family:var(--bl-font-display);text-transform:uppercase;letter-spacing:.02em;padding:20px}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}.chip{height:64px}.sw:first-child .chip{border-radius:32px 0 0 32px}.sw:last-child .chip{border-radius:0 32px 32px 0}b{font-weight:500;font-size:15px;color:var(--bl-bone)}i{font-style:normal;font-size:11px;color:var(--bl-peach);text-transform:none}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--bl-amber)"></div><b>Steel</b><i>--bl-amber · #2E6E95</i></div><div class="sw"><div class="chip" style="background:var(--bl-tan)"></div><b>Sea glass</b><i>--bl-tan · #9AC6C4</i></div><div class="sw"><div class="chip" style="background:var(--bl-lilac)"></div><b>Navy</b><i>--bl-lilac · #0F3A55</i></div><div class="sw"><div class="chip" style="background:var(--bl-peach)"></div><b>Lagoon</b><i>--bl-peach · #4FB3BF</i></div><div class="sw"><div class="chip" style="background:var(--bl-violet)"></div><b>Blue</b><i>--bl-violet · #37A6D1</i></div></div></body></html>
