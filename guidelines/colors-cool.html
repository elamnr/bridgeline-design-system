<!-- @dsCard group="Colors" viewport="700x140" name="Accent & title" subtitle="Orange/gold = title text only; cyan = tiny highlights" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{background:#000;color:var(--bl-tan);font-family:var(--bl-font-display);text-transform:uppercase;letter-spacing:.02em;padding:20px}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}.chip{height:64px}.sw:first-child .chip{border-radius:32px 0 0 32px}.sw:last-child .chip{border-radius:0 32px 32px 0}b{font-weight:500;font-size:15px;color:var(--bl-bone)}i{font-style:normal;font-size:11px;color:var(--bl-peach);text-transform:none}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--bl-orchid)"></div><b>Orange</b><i>--bl-orchid · #F7A541</i></div><div class="sw"><div class="chip" style="background:var(--bl-sunflower)"></div><b>Gold</b><i>--bl-sunflower · #FFC14D</i></div><div class="sw"><div class="chip" style="background:var(--bl-sky)"></div><b>Cyan</b><i>--bl-sky · #66E0F0</i></div><div class="sw"><div class="chip" style="background:var(--bl-rust)"></div><b>Deep</b><i>--bl-rust · #1C3C55</i></div><div class="sw"><div class="chip" style="background:var(--bl-ice)"></div><b>Ghost</b><i>--bl-ice · #D2D5DF</i></div></div></body></html>
